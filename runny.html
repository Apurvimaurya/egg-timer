<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Runny Egg</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

<div class="card egg-card">
    <h1>Runny Egg</h1>

    <img src="images/runny.jpg" class="egg-img">

    <p class="wait-text">Please wait for the given time after pressing begin</p>

    <div class="timer-display">
        <span id="minutes">03</span> : <span id="seconds">00</span>
    </div>

    <button class="btn" onclick="startTimer(1)">Begin</button>
    <button class="btn close" onclick="window.location.href='home.html'">Close</button>
</div>

</body>
</html>
